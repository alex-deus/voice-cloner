name: Publish to Docker Hub
on:
  push:
    tags:
      - "v*"
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on develop
        run: |
          git fetch origin develop
          git merge-base --is-ancestor $GITHUB_SHA origin/develop

      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build . -t deusalex/voice-cloner-cli:latest -t deusalex/voice-cloner-cli:$GITHUB_REF_NAME

      - name: Push image
        run: |
          docker push deusalex/voice-cloner-cli:latest
          docker push deusalex/voice-cloner-cli:$GITHUB_REF_NAME
